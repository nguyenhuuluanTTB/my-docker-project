name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build auth-service Docker image
      run: |
        docker build -t auth-service-image ./MyProject1/backend/auth-service

    - name: Build frontend Docker image
      run: |
        ls -l ./frontend  # Kiểm tra thư mục frontend có tồn tại không
        ls -l ./frontend/cheaptripapp  # Kiểm tra thư mục cheaptripapp có tồn tại không
        docker build -t frontend-image ./frontend/cheaptripapp


    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main'
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Push Docker images
      if: github.ref == 'refs/heads/main'
      run: |
        docker tag auth-service-image ${{ secrets.DOCKER_USERNAME }}/auth-service-image:latest
        docker tag frontend-image ${{ secrets.DOCKER_USERNAME }}/frontend-image:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/auth-service-image:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/frontend-image:latest

    - name: Deploy
      run: |
        echo "Bạn có thể thêm lệnh SSH để deploy hoặc chạy docker-compose ở server tại đây"
