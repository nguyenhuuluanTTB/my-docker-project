name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Chạy khi có push vào nhánh main
  pull_request:
    branches:
      - main  # Chạy khi có pull request vào nhánh main
  workflow_dispatch: # Cho phép bạn kích hoạt thủ công từ giao diện GitHub

jobs:
  build:
    runs-on: ubuntu-latest  # Chạy trên hệ điều hành Ubuntu

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # Lấy mã nguồn từ repository về

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2  # Cài đặt Docker Buildx

    - name: Cache Docker layers
      uses: actions/cache@v2  # Lưu trữ Docker layers để tăng tốc độ build
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Docker image
      run: |
        docker build -t your-docker-image-name .  # Build Docker image từ Dockerfile

    - name: Push Docker image to Docker Hub (optional)
      if: github.ref == 'refs/heads/main'  # Chạy bước này chỉ khi push vào nhánh main
      run: |
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}  # Đăng nhập vào Docker Hub
        docker tag your-docker-image-name your-dockerhub-username/your-docker-image-name:latest
        docker push your-dockerhub-username/your-docker-image-name:latest  # Push Docker image lên Docker Hub

    - name: Deploy to your server (optional)
      run: |
        # Các bước deploy lên server của bạn (ví dụ: sử dụng SSH, rsync, hoặc cài đặt trên server)
        echo "Deploy to server here"
