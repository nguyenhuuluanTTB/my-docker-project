name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Chạy khi có push vào nhánh main (hoặc master nếu bạn dùng nhánh này)
  pull_request:
    branches:
      - main  # Chạy khi có pull request vào nhánh main
  workflow_dispatch: # Cho phép bạn kích hoạt thủ công từ giao diện GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Cache Docker layers
      uses: actions/cache@v2
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Docker image
      run: |
        docker build -t your-docker-image-name .
        
    - name: Push Docker image to Docker Hub (optional)
      if: github.ref == 'refs/heads/main'
      run: |
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        docker tag your-docker-image-name your-dockerhub-username/your-docker-image-name:latest
        docker push your-dockerhub-username/your-docker-image-name:latest

    - name: Deploy to your server (optional)
      run: |
        # Các bước deploy như SSH, rsync, hoặc cài đặt trên server của bạn
        echo "Deploy to server here"
